services:
  mongo:
    image: mongo:4.4.18
    container_name: chanboard-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: SuperSecretPassword123!
      MONGO_INITDB_DATABASE: ChanBoardDb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - chanboard-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  chanboard-api:
    image: anthonyr001/chanboard-api:pi-latest
    container_name: chanboard-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Pi
      - DEPLOYMENT_TARGET=pi
      - PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - chanboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  chanboard-network:
    driver: bridge

volumes:
  mongo-data: