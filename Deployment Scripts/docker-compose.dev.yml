services:
  nginx-dev:
    build:
      context: ./.containers/nginx
      dockerfile: Dockerfile.server
    image: chanboard-nginx:dev
    container_name: chanboard-nginx-dev
    restart: unless-stopped
    ports:
      - "5080:80"
      - "5443:443"
    volumes:
      - ./.containers/nginx/logs/dev:/var/log/nginx
    networks:
      - chanboard-network-dev
    depends_on:
      - chanboard-api-dev
      - chanboard-blob-storage-dev
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  chanboard-api-dev:
    build:
      context: .
      dockerfile: ChanBoardModernized.API/Dockerfile
    image: chanboard-api:dev
    container_name: chanboard-api-dev
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DEPLOYMENT_TARGET=dev
      - PORT=8080
      - ConnectionStrings__BlobStorage=AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;AccountName=devstoreaccount1;BlobEndpoint=http://chanboard-blob-storage-dev:10000/devstoreaccount1;
    ports:
      - "5080:8080"
    restart: unless-stopped
    networks:
      - chanboard-network-dev
    depends_on:
      - chanboard-blob-storage-dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  chanboard-blob-storage-dev:
    extends:
      service: chanboard-blob-storage
    container_name: chanboard-blob-storage-dev
    ports:
      - "10001:10000"
    volumes:
      - ./.containers/blob_storage/data/dev:/data
    networks:
      - chanboard-network-dev
    
  mongo-dev:
    extends:
      service: mongo
    container_name: chanboard-mongo-dev
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: SuperSecretPassword123!
    volumes:
      - ./.containers/mongo_data/dev:/data/db
    networks:
      - chanboard-network-dev
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s