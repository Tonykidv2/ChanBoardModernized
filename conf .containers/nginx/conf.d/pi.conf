# Raspberry Pi Configuration
upstream api_pi {
    server chanboard-api-pi:5000;
}

upstream mongo {
    server chanboard-mongo:27017;
}

upstream blob_storage {
    server chanboard-blob-storage:10000;
}

server {
    listen 80;
    server_name _;

    # API endpoints
    location /api/ {
        proxy_pass http://api_pi/;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://api_pi/health;
        access_log off;
    }

    # OpenAPI/Swagger UI
    location /scalar/ {
        proxy_pass http://api_pi/scalar/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Blob storage (Azurite)
    location /blob/ {
        proxy_pass http://blob_storage/;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Allow large file uploads
        client_max_body_size 100M;
    }

    # MongoDB (optional - usually accessed internally only)
    # Uncomment if you need external MongoDB access through the proxy
    # location /mongo/ {
    #     proxy_pass http://mongo/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    # }

    # Root endpoint
    location / {
        proxy_pass http://api_pi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}