version: '3.8'

services:
  mongo:
    image: mongo:4.4.18
    container_name: chanboard-mongo
    profiles: ["pi"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: SuperSecretPassword123!
      MONGO_INITDB_DATABASE: ChanBoardDb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - chanboard-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  chanboard-api-server:
    build:
      context: .
      dockerfile: ChanBoardModernized.API/Dockerfile
    image: anthonyr001/chanboard-api:latest
    profiles: ["server"]
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_ENVIRONMENT=Production
      - DEPLOYMENT_TARGET=server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  chanboard-api-pi:
    build:
      context: .
      dockerfile: ChanBoardModernized.API/Dockerfile.pi
      platforms: 
        - linux/arm64
    image: anthonyr001/chanboard-api:pi-latest
    profiles: ["pi"]
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Pi
      - DEPLOYMENT_TARGET=pi
      - PORT=5000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - chanboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  chanboard-network:
    driver: bridge

volumes:
  mongo-data: