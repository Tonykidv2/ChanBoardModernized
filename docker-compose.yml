version: '3.8'

services:
  chanboard-api-server:
    build:
      context: .
      dockerfile: ChanBoardModernized.API/Dockerfile
    image: anthonyr001/chanboard-api:latest
    profiles: ["server"]
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DEPLOYMENT_TARGET=server
      - ConnectionStrings__ChanBoardMongoDB=${MONGO_CONNECTION_STRING}
      - DatabaseName=${DATABASE_NAME:-ChanBoardDb}
      - JWT__secret=${JWT_SECRET}
      - JWT__issuer=${JWT_ISSUER:-ChanBoardModernized.API}
      - JWT__audience=${JWT_AUDIENCE:-ChanBoardModernized.Web}
      - JWT__ExpirationInHours=${JWT_EXPIRATION_HOURS:-12}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  chanboard-api-pi:
    build:
      context: .
      dockerfile: ChanBoardModernized.API/Dockerfile.pi
    image: anthonyr001/chanboard-api:pi-latest
    profiles: ["pi"]
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Pi
      - DEPLOYMENT_TARGET=pi
      - PORT=5000
      - ConnectionStrings__ChanBoardMongoDB=${MONGO_DB_CONNECTION_STRING_LOCAL}
      - DatabaseName=${DATABASE_NAME:-ChanBoardDb}
      - JWT__secret=${JWT_SECRET}
      - JWT__issuer=${JWT_ISSUER:-ChanBoardModernized.API}
      - JWT__audience=${JWT_AUDIENCE:-ChanBoardModernized.Web}
      - JWT__ExpirationInHours=${JWT_EXPIRATION_HOURS:-12}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    network_mode: host  # For Pi wireless network access